<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaflet OpenStreetMap Example</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    /* Page layout wrapper */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f8f6;
      color: #1e3127;
    }

    .container {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 16px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 1.6rem;
    }

    p {
      margin: 0 0 14px;
      color: #436154;
    }

    /* Responsive map wrapper */
    .map-frame {
      border: 1px solid #bcd1c3;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 24px rgba(14, 41, 30, 0.12);
      height: 520px;
      background: #fff;
    }

    /* The Leaflet map element must have explicit height */
    #map {
      width: 100%;
      height: 100%;
    }

    @media (max-width: 768px) {
      .map-frame {
        height: 360px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Interactive Map (Leaflet + OpenStreetMap)</h1>
    <p>Uses configurable center coordinates, zoom controls, and a marker popup.</p>

    <div class="map-frame">
      <div id="map"></div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script>
    // ================================
    // 1) Configurable map settings
    // ================================
    const MAP_CONFIG = {
      center: {
        lat: -1.286389,
        lng: 36.817223,
      },
      zoom: 12,
      marker: {
        lat: -1.286389,
        lng: 36.817223,
        popup: 'Panolive Service Area - Nairobi, Kenya',
      },
    };

    // ================================
    // 2) Initialize map
    // ================================
    const map = L.map('map', {
      center: [MAP_CONFIG.center.lat, MAP_CONFIG.center.lng],
      zoom: MAP_CONFIG.zoom,
      zoomControl: true,
      scrollWheelZoom: true,
    });

    // ================================
    // 3) Add OpenStreetMap tile layer
    // ================================
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19,
    }).addTo(map);

    // ================================
    // 4) Add marker with popup
    // ================================
    L.marker([MAP_CONFIG.marker.lat, MAP_CONFIG.marker.lng])
      .addTo(map)
      .bindPopup(MAP_CONFIG.marker.popup)
      .openPopup();

    // ================================
    // 5) Ensure proper rendering in responsive layouts
    // ================================
    window.addEventListener('resize', () => {
      map.invalidateSize();
    });
  </script>
</body>
</html>
